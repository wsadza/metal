stream:
  
  overrideName: 
  overrideLabels: []

# -----------------------------------
# stream - options
# -----------------------------------

  nodeSelector: 
    nvidia.com/gpu.count: "1"

  runtimeClassName: nvidia

# -----------------------------------
# stream - containers (primary)
# -----------------------------------

  # ghcr.io/wsadza/metal/full-ubuntu:1.0.0
  # ghcr.io/coturn/coturn:edge-debian
  image:
    registry: ghcr.io/wsadza
    repository: metal
    package: full-ubuntu
    tag: 1.0.0
    pullSecrets: []
    pullPolicy: Always 

  env: 
  - name: SELKIES_PORT
    value: "8080"
  - name: SELKIES_METRICS_HTTP_PORT
    value: "9090"
  - name: SUPERVISOR_PORT
    value: "9091"
  - name: DBUS_PORT
    value: "9092"
  - name: SELKIES_TURN_HOST
    value: "anykey.pl"
  - name: SELKIES_TURN_PORT
    value: "32000"
  - name: SELKIES_TURN_USERNAME
    value: "user"
  - name: SELKIES_TURN_PASSWORD
    value: "pass"
  - name: SELKIES_ENCODER
    value: "nvh264enc"
  - name: PRIME_RENDERER_GLOBAL
    value: "true" 
  - name: PULSE_SERVER 
    value: tcp:pipewire.metal.svc.cluster.local:4713
  - name: SELKIES_ENABLE_WEBRTC_STATISTICS
    value: "true"

  command: [ 
    "bash", 
    "-c", 
    "sudo sed -i 's/readiness_turn//g' /usr/bin/40_start_stream.sh && ./entrypoint.sh",
  ]
  #command: []

  ports: []
  #ports: 
  #- containerPort: 9090
  #  name: metrics

  resources:
    requests:
      memory: 5Gi 
      nvidia.com/gpu: 1
    limits:
      memory: 10Gi
      nvidia.com/gpu: 1

  extraVolumesMounts: 
    - name: shared-logs 
      mountPath: /run/user/1000/logs
      subPath: logs

# -----------------------------------
# stream - containers (additionals)
# -----------------------------------
  sidecars:

# helper-gateway
    - name: helper-gateway
      image: openresty:latest
      imagePullPolicy: Never
      command: [ 
        "bash", 
        "-c", 
        "cd /modules && mkdir logs && /usr/local/openresty/nginx/sbin/nginx -p ${PWD}/ -g \"daemon off;error_log /dev/stdout debug;\"", 
      ]
      ports: 
      - containerPort: 80
        name: helper-gateway
      volumeMounts:
        - name: configmap-helper-gateway
          mountPath: /modules/conf/nginx.conf
          subPath: nginx.conf
        - name: shared-logs
          mountPath: /tmp/shared-logs
          subPath: logs

# proxy-helper
#    - name: helper-proxy
#      image: nginx
#      ports: 
#      - containerPort: 80
#        name: helper-proxy 
#      volumeMounts:
#        - name: configmap-helper-proxy
#          mountPath: /etc/nginx/nginx.conf
#          subPath: nginx.conf

  initContainers: []

# -----------------------------------
# stream - volumes 
# -----------------------------------

  extraVolumes:
    - name: configmap-helper-gateway
      type: configMap

    - name: configmap-helper-proxy
      type: configMap

    - name: shared-logs 
      type: emptyDir

    - name: pvc-0
      type: persistentVolumeClaim
      spec:
        accessModes:
          - ReadWriteMany
        storage: 50Gi
        storageClassName: storage-local-retain
        volumeMount: /opt/config
        annotations:
          "helm.sh/resource-policy": "keep"

    - name: pvc-1
      type: persistentVolumeClaim
      spec:
        accessModes:
          - ReadWriteMany
        storage: 50Gi
        storageClassName: storage-local-retain
        volumeMount: /opt/config
        annotations:
          "helm.sh/resource-policy": "keep"

# -----------------------------------
# stream - networking
# -----------------------------------

  service:
    annotations: {}
    type: ClusterIP
    ports:
      - name: helper-gateway
        port: 80
        targetPort: 80
        protocol: TCP
#      - name: metrics
#        port: 9090
#        targetPort: 9090
#        protocol: TCP

  ingress:
    enabled: true 
    className: traefik
    annotations:
      "traefik.ingress.kubernetes.io/router.entrypoints": websecure
    path: "/"
    pathType: "Prefix"
    host: "stream.anykey.pl"
    portNumber: 80
    tls: [] 

# -----------------------------------
# Monolith - probes 
# -----------------------------------

  startupProbe:
    enabled: false 
    httpGet:
      scheme: HTTP
      path: /health
      port: 8080
    initialDelaySeconds: 5 
    periodSeconds: 5 
    successThreshold: 1
    failureThreshold: 5
    timeoutSeconds: 1

# -----------------------------------
# Monolith - hpa
# -----------------------------------

  hpa:

# keda - autoscaler
#   keda: []
    keda: 
      enabled: true 
      minReplicaCount: 1
      maxReplicaCount: 4
      triggers: 
        - type: prometheus
          metricType: Value
          metadata:
            serverAddress: http://prometheus-server.metal.svc.cluster.local
            query: scaling_needed
            threshold: "0.5"
      advanced:
        horizontalPodAutoscalerConfig:
          behavior:
            scaleUp:
              policies:
              - type: Pods
                value: 1  
                periodSeconds: 1 
              stabilizationWindowSeconds: 1 
            scaleDown:
              policies:
              - type: Pods
                value: 1
                periodSeconds: 60
              stabilizationWindowSeconds: 60


