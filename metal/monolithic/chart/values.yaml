identity-provider:
  enabled: false 

  auth:
    adminUser: "admin"
    adminPassword: "admin"
  
  extraEnvVars: |
      - name: PROXY_ADDRESS_FORWARDING
        value: "true"
      - name: REDIRECT_SOCKET
        value: 'proxy-https'
      - name: KEYCLOAK_FRONTEND_URL
        value: 'https://identity.anykey.pl/'
      - name: KC_HOSTNAME
        value: 'identity.anykey.pl'
      - name: KC_PROXY
        value: 'edge'
      - name: KC_HTTP_ENABLED
        value: 'true'
      - name: KC_HOSTNAME_HTTPS_STRICT
        value: 'false'
  
  ingress:
    enabled: true
    ingressClassName: traefik
    hostname: identity.anykey.pl
    annotations:
      "traefik.ingress.kubernetes.io/router.entrypoints": websecure
      "traefik.ingress.kubernetes.io/router.middlewares": default-keycloak-auth@kubernetescrd

  keycloakConfigCli:
    enabled: true
    existingConfigmap: "configmap-keycloak"

identity-proxy:
  enabled: false

