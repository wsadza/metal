coturn:
  enabled: true
  
  overrideName: 
  overrideLabels: []

# -----------------------------------
# Coturn - configuration 
# -----------------------------------

  configuration:
    realm: anykey.pl

    auth:
      username: user
      password: pass

    listeningIP: 0.0.0.0

    ports:
      min: 49152
      max: 65535
      listening: 3478 
      tlsListening: 5349  

# -----------------------------------
# Coturn - pod options
# -----------------------------------

  nodeSelector: 
    nvidia.com/gpu.count: "1"

  runtimeClassName: 

  hostNetwork:

# -----------------------------------
# Coturn - pod container (primary)
# -----------------------------------

  image:
    registry: ghcr.io/coturn
    repository: 
    package: coturn
    tag: edge-debian
    pullSecrets: []
    pullPolicy: Always 

  command: []

  args: 
    - "-c"
    - "/turnserver.conf"

  env: []

  ports:
    - containerPort: 3478 
      name: coturn-udp
      protocol: UDP
    - containerPort: 3478 
      name: coturn-tcp
      protocol: tcp 

  resources: []

  extraVolumesMounts:
    - name: metal-coturn-configuration
      mountPath: /turnserver.conf
      subPath: turnserver.conf

# -----------------------------------
# Coturn - pod containers (additionals)
# -----------------------------------

  sidecars: []

  initContainers: []

# -----------------------------------
# Coturn - pod volumes 
# -----------------------------------

  extraVolumes:
    - name: metal-coturn-configuration
      type: configMap

# -----------------------------------
# Coturn - networking - service
# -----------------------------------

  service:
    annotations: {}
    type: NodePort 
    ports:
      - name: coturn-udp
        port: 3478
        targetPort: 3478
        protocol: UDP 
        nodePort: 32000
      - name: coturn-tcp
        port: 3478
        targetPort: 3478
        protocol: TCP 
        nodePort: 32000

# -----------------------------------
# Coturn - networking - ingress 
# -----------------------------------

  ingress:

# -----------------------------------
# Coturn - probes 
# -----------------------------------

  startupProbe:
    enabled: true 
    exec:
      command:
        - /usr/bin/turnutils_uclient 
        - -y 
        - -u 
        - "user"
        - -w 
        - "pass"
        - 127.0.0.1 
    initialDelaySeconds: 15 
    periodSeconds: 15 
    successThreshold: 1
    failureThreshold: 15
    timeoutSeconds: 15

# -----------------------------------
# Coturn - hpa
# -----------------------------------

  hpa:

