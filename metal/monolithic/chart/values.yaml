
global:
  labels: []

gatekeeper:
  enabled: true 

  serviceAccountName: metal-gatekeeper 

# -----------------------------------
# Gateway - pod container (primary)
# -----------------------------------

  image:
    registry:
    repository: 
    package: openresty 
    tag: latest 
    pullSecrets: []
    pullPolicy: Never 

  command: [ 
    "bash", 
    "-c", 
    "cd /modules && mkdir logs && /usr/local/openresty/nginx/sbin/nginx -p ${PWD}/ -g \"daemon off;error_log /dev/stdout debug;\"", 
  ]
#  command: 
#  - "bash"
#  - "-c"
#  - "cd /modules"
#  - "mkdir logs"
#  - "/usr/local/openresty/nginx/sbin/nginx"
#  - "-p ${PWD}/"
#  - "-g \"daemon off; error_log /dev/stdout debug;\""

  args: []

  env: []

  ports:
    - containerPort: 80 
      name: gatekeeper-tcp 
      protocol: TCP 

  resources: []

  extraVolumesMounts:
    - name: metal-gatekeeper-nginx
      mountPath: /modules/conf/nginx.conf
      subPath: nginx.conf 

    - name: metal-gatekeeper-lua
      mountPath: /modules/lua/main.lua
      subPath: main.lua 

# -----------------------------------
# Gatekeeper - networking - ingress 
# -----------------------------------

  ingress:
    enabled: true 
    className: traefik
    annotations:
      "traefik.ingress.kubernetes.io/router.entrypoints": websecure
    path: "/"
    pathType: "Prefix"
    host: "metal.anykey.pl"
    portNumber: 80
    tls: [] 

# -----------------------------------
# Gatekeeper - probes 
# -----------------------------------

  startupProbe:
    enabled: false 

# -----------------------------------
# Gatekeeper - pod volumes 
# -----------------------------------

  extraVolumes:
    - name: metal-gatekeeper-nginx
      type: configMap

    - name: metal-gatekeeper-lua
      type: configMap

# -----------------------------------
# Coturn - networking - service
# -----------------------------------

  service:
    annotations: {}
    type: ClusterIP 
    ports:
      - name: gatekeeper-tcp
        port: 80 
        targetPort: 80
        protocol: TCP 

