apiVersion: v1
kind: Service
metadata:
  name: "{{- include "stream.fullname" . }}"
  labels:
    {{- include "stream.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.global.annotations }}
    {{- toYaml .Values.global.annotations | nindent 4 }}
    {{- end }}
    {{- if .Values.stream.service.annotations }}
    {{- toYaml .Values.stream.service.annotations | nindent 4 }}
    {{- end }}
spec:
  type: {{ .Values.stream.service.type }}
  ports:
    {{- if .Values.stream.service.ports }}
      {{- .Values.stream.service.ports | toYaml | nindent 4 }}
    {{- end }}
  selector:
    {{- include "stream.matchLabels" . | nindent 4 }}
