{{/*
############################################################
# Copyright (c) 2024 Utilizable 
# Released under the MIT license
# ----------------------------------------------------------
#
# KEDA Scaled Object definition
#
# Example:
# - https://github.com/kedacore/charts/tree/main/samples
# Chart:
# - https://github.com/kedacore/charts/tree/main
# Documentation:
# - https://keda.sh/docs/1.4/
# Notes:
# - describe horizonalPodAutoscaled for debug purpose;
#   monitor 'current / traget' and adjust it accordinaly.
#
############################################################
*/}}
{{- if .Values.stream.hpa -}}
{{- if .Values.stream.hpa.keda.enabled -}}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: "{{- include "stream.fullname" . }}"
  labels:
    {{- include "stream.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: "{{- include "stream.fullname" . }}"
  minReplicaCount: {{ .Values.stream.hpa.keda.minReplicaCount }} 
  maxReplicaCount: {{ .Values.stream.hpa.keda.maxReplicaCount }} 
{{/*
  # -----------------------------------
  # KEDA - Triggers 
  # -----------------------------------
*/}}
  triggers:
  {{- if .Values.stream.hpa.keda.triggers }}
    {{- .Values.stream.hpa.keda.triggers | toYaml | nindent 2 }}
  {{- end }}
{{/*
  # -----------------------------------
  # KEDA - ADVANCED 
  # -----------------------------------
*/}}
  {{- if .Values.stream.hpa.keda.advanced }}
  advanced:
    {{- .Values.stream.hpa.keda.advanced | toYaml | nindent 4 }}
  {{- end }}
...
{{- end }}
{{- end }}

