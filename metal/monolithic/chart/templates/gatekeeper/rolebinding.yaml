{{- if .Values.gatekeeper.service }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: "{{- include "gatekeeper.fullname" . }}"
subjects:
  - kind: ServiceAccount
    name: "{{- include "gatekeeper.fullname" . }}"
roleRef:
  kind: Role
  name: "{{- include "gatekeeper.fullname" . }}"
  apiGroup: rbac.authorization.k8s.io
...
{{- end }}
