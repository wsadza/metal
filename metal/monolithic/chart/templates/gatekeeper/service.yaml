{{- if .Values.gatekeeper.service }}
---
apiVersion: v1
kind: Service
metadata:
  name: "{{- include "gatekeeper.fullname" . }}"
  labels:
    {{- include "gatekeeper.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.global.annotations }}
    {{- toYaml .Values.global.annotations | nindent 4 }}
    {{- end }}
    {{- if .Values.gatekeeper.service.annotations }}
    {{- toYaml .Values.gatekeeper.service.annotations | nindent 4 }}
    {{- end }}
spec:
  type: {{ .Values.gatekeeper.service.type }}
  ports:
    {{- if .Values.gatekeeper.service.ports }}
      {{- .Values.gatekeeper.service.ports | toYaml | nindent 4 }}
    {{- end }}
  selector:
    {{- include "gatekeeper.matchLabels" . | nindent 4 }}
...
{{- end }}
